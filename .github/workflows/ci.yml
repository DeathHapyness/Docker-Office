name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22   # >= 22.18: o servidor roda .ts direto (type stripping)
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:web

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: check
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Build da imagem
        run: docker build -f deploy/Dockerfile -t docker-office:ci .
      - name: Sobe em modo demo e testa /api/health
        run: |
          docker run -d --name do-ci -e DOCKER_OFFICE_DEMO=1 -p 8420:8420 --read-only --cap-drop ALL docker-office:ci
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8420/api/health && exit 0; sleep 1; done
          docker logs do-ci; exit 1
