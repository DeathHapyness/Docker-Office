# Docker Office no servidor:  docker compose -f deploy/compose.yml up -d --build
# Abra http://<ip-do-servidor>:8420  (papel de parede: /?wallpaper=1)
#
# Hoje o app mostra dados simulados e NÃO acessa o Docker. Quando o backend chegar, ele vai
# falar com o Engine via docker-socket-proxy (somente leitura), nunca montando o socket direto.
name: docker-office

services:
  docker-office:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: docker-office:local
    container_name: docker-office
    restart: unless-stopped
    ports:
      - "8420:8420"          # troque por "127.0.0.1:8420:8420" para só a própria máquina
    read_only: true
    tmpfs:
      - /tmp:size=8m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 64
