# Docker Office no servidor:  docker compose -f deploy/compose.yml up -d --build
# Abra http://<ip-do-servidor>:8420   (papel de parede: /?wallpaper=1)
#
# O app NUNCA monta o socket do Docker: fala com um docker-socket-proxy que só libera
# leitura (listar containers, eventos, stats) numa rede interna sem acesso externo.
name: docker-office

services:
  socket-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0
    restart: unless-stopped
    environment:
      CONTAINERS: 1   # GET /containers/* (lista, inspect, stats)
      EVENTS: 1       # GET /events
      PING: 1
      VERSION: 1
      POST: 0         # nada de start/stop/exec/rm: somente leitura
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [docker-api]
    security_opt:
      - no-new-privileges:true
    mem_limit: 64m
    labels:
      docker-office.character: socket-proxy

  docker-office:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: docker-office:local
    restart: unless-stopped
    depends_on: [socket-proxy]
    environment:
      DOCKER_HOST: tcp://socket-proxy:2375
      # Recomendado na LAN: token com 16+ caracteres (gere com: openssl rand -hex 16).
      # Acesse uma vez com http://<ip>:8420/?token=SEU_TOKEN (fica salvo no navegador).
      DOCKER_OFFICE_TOKEN: ${DOCKER_OFFICE_TOKEN:-}
    ports:
      - "${DOCKER_OFFICE_PORT:-8420}:8420"   # use "127.0.0.1:8420:8420" para só a própria máquina
    networks: [docker-api, web]
    read_only: true
    tmpfs:
      - /tmp:size=8m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 192m
    cpus: 0.5
    pids_limit: 64

networks:
  docker-api:
    internal: true   # o proxy não tem saída para fora; só o docker-office fala com ele
  web: {}
