# Docker Office no servidor:  docker compose -f deploy/compose.yml up -d --build
# Abra http://<ip-do-servidor>:8420 — a primeira visita escolhe senha ou acesso aberto
# (papel de parede: /?wallpaper=1)
#
# O app NUNCA monta o socket do Docker: fala com um docker-socket-proxy que só libera
# leitura (listar containers, eventos, stats) numa rede interna sem acesso externo.
name: docker-office

services:
  socket-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0
    restart: unless-stopped
    environment:
      CONTAINERS: 1   # GET /containers/* (lista, inspect, stats)
      EVENTS: 1       # GET /events
      PING: 1
      VERSION: 1
      POST: 0         # nada de start/stop/exec/rm: somente leitura
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [docker-api]
    security_opt:
      - no-new-privileges:true
    mem_limit: 64m
    labels:
      docker-office.character: socket-proxy

  docker-office:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: docker-office:local
    restart: unless-stopped
    depends_on: [socket-proxy]
    environment:
      DOCKER_HOST: tcp://socket-proxy:2375
      # Opcional. Sem ele, a primeira visita pergunta: criar senha ou deixar aberto.
      # Com ele (16+ caracteres), vale o token fixo e a pergunta não aparece.
      DOCKER_OFFICE_TOKEN: ${DOCKER_OFFICE_TOKEN:-}
    volumes:
      - data:/data   # escolha de acesso + hash da senha (apagar auth.json = perguntar de novo)
    ports:
      - "${DOCKER_OFFICE_PORT:-8420}:8420"   # use "127.0.0.1:8420:8420" para só a própria máquina
    networks: [docker-api, web]
    read_only: true
    tmpfs:
      - /tmp:size=8m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 192m
    cpus: 0.5
    pids_limit: 64

volumes:
  data: {}

networks:
  docker-api:
    internal: true   # o proxy não tem saída para fora; só o docker-office fala com ele
  web: {}
