<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Docker Office</title>
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/scene.css">
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three/build/three.module.js",
        "three/addons/": "./vendor/three/examples/jsm/"
      }
    }
  </script>
  <script type="module" src="build/main.js"></script>
</head>
<body>
  <header class="topbar">
    <h1><span class="logo" aria-hidden="true"></span>Docker Office</h1>
    <ul class="legend" aria-label="Legenda de estados">
      <li data-state="working"><span class="dot"></span>Trabalhando</li>
      <li data-state="busy"><span class="dot"></span>Ocupado</li>
      <li data-state="stopped"><span class="dot"></span>Parado</li>
      <li data-state="error"><span class="dot"></span>Erro</li>
    </ul>
    <nav id="demo" class="demo" aria-label="Simulação">
      <span>Simular:</span>
      <button data-set="idle">Ocioso</button>
      <button data-set="active">Trabalhando</button>
      <button data-set="busy">Ocupado</button>
      <button data-set="stopped">Parado</button>
      <button data-set="error">Erro</button>
      <button data-set="mix">Misturar</button>
      <button data-set="offline" aria-pressed="false">Docker offline</button>
    </nav>
  </header>
  <main id="office" class="office" data-engine="connected"></main>
  <nav id="cameras" class="cameras" aria-label="Câmera">
    <button data-cam="free">Livre</button>
    <button data-cam="iso" aria-pressed="true">Isométrica</button>
    <button data-cam="top">De cima</button>
    <button data-cam="side">De lado</button>
    <button data-cam="below">De baixo</button>
    <span class="sep"></span>
    <button data-toggle="pixel" aria-pressed="false" title="Renderização em baixa resolução, estilo pixel">Pixel</button>
    <p class="hint">Arraste para girar · roda para zoom · botão direito para mover · clique num personagem para segui-lo</p>
  </nav>
</body>
</html>
