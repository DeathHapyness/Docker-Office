services:
  kopia:
    restart: "no"
    ports: !override
      - "127.0.0.1:51515:51515"
    env_file: !reset []
    environment:
      KOPIA_PASSWORD: ${KOPIA_PASSWORD}
    volumes: !override
      - ${DATA_DIR}/kopia/config:/app/config
      - ${DATA_DIR}/kopia/cache:/app/cache
      - ${DATA_DIR}/kopia/logs:/app/logs
      - ${DATA_DIR}/kopia/repository:/repository

# todos na mesma rede: cada pasta criando a sua esgota os pools de IP do Docker
networks:
  default:
    name: media_network
    external: true
